<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Golobe</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for the auth page */
        .auth-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .auth-card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-card h1 {
            font-size: 24px;
            margin-bottom: 24px;
        }
        .auth-card .field-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .auth-card .btn {
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Create an Account</h1>
            <form id="signup-form">
                <div class="field-group"><label for="signup-name">Full Name</label><input type="text" id="signup-name" required></div>
                <div class="field-group"><label for="signup-email">Email Address</label><input type="email" id="signup-email" required></div>
                <div class="field-group"><label for="signup-password">Password</label><input type="password" id="signup-password" required></div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            <p style="margin-top: 16px; font-size: 14px;">Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login</a></p>
        </div>
    </div>
    <script>
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            // Lấy danh sách người dùng từ localStorage, hoặc tạo mảng rỗng nếu chưa có
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // Kiểm tra xem email đã tồn tại chưa
            const existingUser = users.find(user => user.email === email);
            if (existingUser) {
                alert('Email đã tồn tại. Vui lòng sử dụng email khác.');
                return;
            }

            // Thêm người dùng mới
            users.push({ name, email, password });
            localStorage.setItem('users', JSON.stringify(users));

            alert('Đăng ký thành công! Bạn sẽ được chuyển đến trang đăng nhập.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
