<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golobe - Payment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header class="static-header">
        <div class="container navbar">
            <ul class="nav-links">
                <li><a href="flights.html" class="header-link"><i class="fa-solid fa-plane"></i> Find Flight</a></li>
                <li><a href="hotels.html" class="header-link"><i class="fa-solid fa-bed"></i> Find Stays</a></li>
            </ul>
            <a href="index.html" class="logo dark-logo">
                <i class="fa-solid fa-paper-plane"></i> Golobe
            </a>
            <div class="auth-btns" id="auth-buttons">
                <a href="login.html" class="btn btn-text-dark">Login</a>
                <a href="signup.html" class="btn btn-dark">Sign up</a>
            </div>
            <div class="auth-btns" id="user-info" style="display: none;">
                <span id="user-name" class="header-link"></span>
                <button id="logout-btn" class="btn btn-dark">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="container page4-main">
        <div style="margin-bottom: 24px;">
            <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>
        <!-- Success Banner / Status -->
        <section class="booking-status-card">
            <div class="status-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="status-text">
                <h2>Booking Confirmed!</h2>
                <p>Your ticket has been sent to your email. Booking ID: <strong>#GLB-8839201</strong></p>
            </div>
            <div class="status-actions">
                <button class="btn-secondary-outline"><i class="fa-solid fa-download"></i> Download Ticket</button>
            </div>
        </section>

        <div class="checkout-grid">
            <!-- Left Payment & Summary Panel -->
            <div class="checkout-left">
                <!-- Payment Methods Card -->
                <div class="info-card payment-methods-card">
                    <h4>Payment Method</h4>
                    
                    <div class="payment-options">
                        <label class="payment-card active">
                            <input type="radio" name="payment" checked>
                            <div class="payment-info">
                                <strong>Credit / Debit Card</strong>
                                <span>Mastercard ending in 4242</span>
                            </div>
                            <i class="fa-brands fa-cc-mastercard payment-icon"></i>
                        </label>

                        <label class="payment-card">
                            <input type="radio" name="payment">
                            <div class="payment-info">
                                <strong>PayPal Account</strong>
                                <span id="paypal-email"></span>
                            </div>
                            <i class="fa-brands fa-paypal payment-icon"></i>
                        </label>
                    </div>

                    <!-- Payment Form Input -->
                    <form class="payment-form">
                        <div class="field-group" style="margin-bottom: 16px;">
                            <label>Cardholder Name</label>
                            <input type="text" id="card-name" placeholder="John Doe">
                        </div>
                        <div class="field-group" style="margin-bottom: 16px;">
                            <label>Card Number</label>
                            <input type="text" value="4242 •••• •••• 4242" placeholder="1234 5678 9101 1121">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="field-group">
                                <label>Expiry Date</label>
                                <input type="text" value="08/28" placeholder="MM/YY">
                            </div>
                            <div class="field-group">
                                <label>CVC / CVV</label>
                                <input type="password" value="•••" placeholder="123">
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Container for all tickets/bookings from the cart -->
                <div id="tickets-container"></div>
            </div>

            <!-- Right Side Fare Breakdown -->
            <aside class="checkout-right">
                <div class="info-card price-summary-box">
                    <h4>Your Cart</h4>
                    
                    <div id="cart-items-container"></div>

                    <ul class="fare-details" id="fare-summary">
                        <!-- Tổng tiền sẽ được chèn vào đây -->
                    </ul>

                    <div class="payment-guarantee">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>256-bit SSL Encrypted Payment</span>
                    </div>

                    <a href="index.html" class="btn btn-primary" style="width: 100%; text-align: center;">Back to Homepage</a>
                </div>
            </aside>
        </div>
    </main>

    <footer style="margin-top: 80px;">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <div class="footer-logo"><i class="fa-solid fa-paper-plane"></i> Golobe</div>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Điền thông tin người dùng
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                document.getElementById('card-name').value = currentUser.name;
                document.getElementById('paypal-email').textContent = currentUser.email;
            } else {
                // Nếu chưa đăng nhập, yêu cầu đăng nhập để thanh toán
                alert('Please log in to proceed with the payment.');
                window.location.href = 'login.html';
                return;
            }

            // Hiển thị các sản phẩm trong giỏ hàng
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartContainer = document.getElementById('cart-items-container');
            const ticketsContainer = document.getElementById('tickets-container');
            const fareSummary = document.getElementById('fare-summary');
            let totalPrice = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p>Your cart is empty. Add some items to proceed.</p>';
                fareSummary.style.display = 'none';
                // Ẩn phần vé và form thanh toán nếu giỏ hàng trống
                document.querySelector('.checkout-left').style.display = 'none';
                document.querySelector('.booking-status-card').style.display = 'none';
            } else {
                cart.forEach(item => {
                    cartContainer.innerHTML += `
                        <div class="flight-mini-summary">
                            <img src="${item.img}" alt="${item.name}" style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover;">
                            <div style="flex-grow: 1;">
                                <h5>${item.name}</h5>
                                <span style="font-size: 12px; color: var(--text-muted);">${item.type} - ${item.route}</span>
                            </div>
                            <strong style="margin-left: auto; font-size: 16px;">$${item.price.toFixed(2)}</strong>
                            <button class="btn-remove-item" data-item-name="${item.name}" data-item-type="${item.type}" title="Remove item" style="background: none; border: none; color: var(--danger); cursor: pointer; margin-left: 10px; font-size: 16px;"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                    totalPrice += item.price;

                    // Tạo thẻ "vé" chi tiết cho từng sản phẩm
                    let ticketIcon = 'fa-solid fa-ticket';
                    if (item.type === 'Hotel') ticketIcon = 'fa-solid fa-bed';
                    if (item.type === 'Tour') ticketIcon = 'fa-solid fa-map-location-dot';

                    ticketsContainer.innerHTML += `
                        <div class="info-card ticket-card" style="margin-bottom: 24px;">
                            <div class="ticket-header">
                                <div class="ticket-time">
                                    <h2>${item.name}</h2>
                                    <span>${item.type}</span>
                                </div>
                                <div class="ticket-flight-icon">
                                    <i class="${ticketIcon}"></i>
                                </div>
                                <div class="ticket-time" style="text-align: right;">
                                    <h2>$${item.price.toFixed(2)}</h2>
                                    <span>Price</span>
                                </div>
                            </div>

                            <div class="ticket-divider">
                                <div class="circle-left"></div>
                                <div class="dashed-line"></div>
                                <div class="circle-right"></div>
                            </div>

                            <div class="ticket-body">
                                <div class="passenger-info">
                                    <img src="${item.img}" alt="${item.name}" style="width: 44px; height: 44px; border-radius: 8px; object-fit: cover;">
                                    <div>
                                        <h4 id="ticket-passenger-name">${currentUser.name}</h4>
                                        <p>Booking for</p>
                                    </div>
                                </div>
                                <div class="flight-meta-grid">
                                    <div><label>Details</label><strong>${item.route}</strong></div>
                                    <div><label>Date</label><strong>07 Nov 22</strong></div>
                                    <div><label>Booking ID</label><strong>#GLB-8839201</strong></div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                fareSummary.innerHTML = `
                    <li class="total">
                        <span>Total Payment</span> 
                        <span class="total-price">$${totalPrice.toFixed(2)}</span>
                    </li>
                `;

                // Thêm trình xử lý sự kiện cho các nút xóa
                document.querySelectorAll('.btn-remove-item').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const itemName = e.currentTarget.dataset.itemName;
                        const itemType = e.currentTarget.dataset.itemType;

                        if (confirm(`Are you sure you want to remove "${itemName}" from your cart?`)) {
                            // Đọc giỏ hàng từ localStorage
                            let cart = JSON.parse(localStorage.getItem('cart')) || [];

                            // Lọc ra sản phẩm cần xóa
                            const updatedCart = cart.filter(cartItem => !(cartItem.name === itemName && cartItem.type === itemType));

                            // Cập nhật lại localStorage và tải lại trang
                            localStorage.setItem('cart', JSON.stringify(updatedCart));
                            window.location.reload();
                        }
                    });
                });
            }
        });
    </script>
</body></html>
