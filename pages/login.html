<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Golobe</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for the auth page */
        .auth-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .auth-card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-card h1 {
            font-size: 24px;
            margin-bottom: 24px;
        }
        .auth-card .field-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .auth-card .btn {
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Login to your Account</h1>
            <form id="login-form">
                <div class="field-group"><label for="login-email">Email Address</label><input type="email" id="login-email" required></div>
                <div class="field-group"><label for="login-password">Password</label><input type="password" id="login-password" required></div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p style="margin-top: 16px; font-size: 14px;">Don't have an account? <a href="signup.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up</a></p>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // Lấy danh sách người dùng từ localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // Tìm người dùng với email và mật khẩu khớp
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                alert('Đăng nhập thành công!');
                // Lưu thông tin người dùng hiện tại vào localStorage
                localStorage.setItem('currentUser', JSON.stringify(user));
                // Chuyển hướng về trang chủ
                window.location.href = 'index.html';
            } else {
                alert('Email hoặc mật khẩu không chính xác.');
            }
        });
    </script>
</body>
</html>
